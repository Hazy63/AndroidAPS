name: Dennis Signed Release

# Baut die AAPS "full" App signiert mit unserem eigenen Keystore.
# Dadurch bleibt der Signatur-Fingerabdruck über alle Versionen gleich,
# und Android erlaubt ein normales Update statt Deinstallation + Neuinstallation.
#
# Auslösen:
#  - manuell im Actions-Tab ("Run workflow")
#  - automatisch bei jedem Push eines Tags im Format v* (z.B. v3.4.0.0)
#  - automatisch nach jedem Merge von Upstream-Änderungen auf master
#    (ausgelöst durch den "Auto Sync Upstream" Workflow)

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - 'v*'

jobs:
  build:
    name: Build & Sign APK
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        run: |
          MISSING=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing secret: $name"
              MISSING=1
            fi
          done
          if [ "$MISSING" -eq 1 ]; then
            exit 1
          fi
          echo "All required secrets present."
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Decode keystore file
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/keystore/keystore.jks"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Der Build starb am 01.11.2026 mit "The runner has received a shutdown
      # signal" - kein Code-Fehler, sondern der Runner ging am Arbeitsspeicher
      # aus. Upstream 4.0.0 hat den Kotlin-Daemon von 2g auf 4g gehoben; mit
      # 8g Gradle-Heap dazu sprengt das die 16 GB des Standard-Runners.
      # Deshalb: Ressourcen protokollieren, Swap als Netz, und beim Build
      # unten Heaps, die rechnerisch in den Runner passen.
      - name: Show runner resources
        run: |
          echo "CPUs: $(nproc)"
          free -h
          df -h / /mnt

      - name: Add swap as safety net
        run: |
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          sudo sysctl -w vm.swappiness=10
          free -h

      - name: Extract VERSION
        run: |
          VERSION=$(grep 'val appVersion' buildSrc/src/main/kotlin/Versions.kt | awk -F '"' '{print $2}')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build signed release APK (full flavor)
        run: |
          ./gradlew :app:assembleFullRelease \
            --max-workers=4 \
            -Dorg.gradle.jvmargs="-Xmx5g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Xss4m" \
            -Pkotlin.daemon.jvm.options="-Xmx3g" \
            -Dorg.gradle.daemon=false \
            -Dorg.gradle.caching=true \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/keystore/keystore.jks" \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"

      - name: Rename APK with version
        run: |
          mkdir -p out
          cp app/build/outputs/apk/full/release/*.apk "out/aaps-${VERSION}-signed.apk"

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: aaps-signed-apk
          path: out/*.apk
          retention-days: 90

      - name: Upload APK to Google Drive
        run: |
          set -e
          echo "Getting Google OAuth2 access token..."
          TOKEN_RESPONSE=$(curl -s -X POST https://oauth2.googleapis.com/token \
            -d client_id="${{ secrets.GDRIVE_CLIENT_ID }}" \
            -d client_secret="${{ secrets.GDRIVE_CLIENT_SECRET }}" \
            -d refresh_token="${{ secrets.GDRIVE_REFRESH_TOKEN }}" \
            -d grant_type=refresh_token)
          ACCESS_TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r .access_token)
          if [ -z "$ACCESS_TOKEN" ] || [ "$ACCESS_TOKEN" = "null" ]; then
            echo "Failed to get access token."
            echo "$TOKEN_RESPONSE"
            exit 1
          fi

          FILE=$(ls out/*.apk)
          NAME=$(basename "$FILE")
          FOLDER_ID="118LH5V5QTB4WlwplbnAsom6vZuhTvhni"

          echo "Checking if $NAME already exists in Drive folder..."
          QUERY="name='${NAME}' and '${FOLDER_ID}' in parents and trashed=false"
          ENCODED_QUERY=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$QUERY")
          FILE_ID=$(curl -s \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://www.googleapis.com/drive/v3/files?q=${ENCODED_QUERY}&fields=files(id)" \
            | jq -r '.files[0].id')

          if [[ -n "$FILE_ID" && "$FILE_ID" != "null" ]]; then
            echo "Deleting existing file with ID: $FILE_ID"
            curl -s -X DELETE \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              "https://www.googleapis.com/drive/v3/files/${FILE_ID}"
          fi

          echo "Uploading $NAME to Google Drive..."
          RESPONSE=$(curl -s -w "%{http_code}" -o /tmp/gdrive_response.json \
            -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -F "metadata={\"name\":\"$NAME\", \"parents\":[\"$FOLDER_ID\"]};type=application/json;charset=UTF-8" \
            -F "file=@$FILE;type=application/vnd.android.package-archive" \
            "https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart")

          HTTP_CODE="${RESPONSE: -3}"
          if [[ "$HTTP_CODE" != "200" && "$HTTP_CODE" != "201" ]]; then
            echo "Upload failed with HTTP status: $HTTP_CODE"
            cat /tmp/gdrive_response.json
            exit 1
          fi

          echo "Uploaded: $NAME to Drive folder $FOLDER_ID"

      - name: Create GitHub Release (only on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          name: AAPS ${{ github.ref_name }} (signed)
          body: |
            Signierte AAPS APK, gebaut mit eigenem Keystore.
            Installation über diese APK ersetzt eine vorherige Installation mit
            dem gleichen Keystore als normales Update (Daten bleiben erhalten).
